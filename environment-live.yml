# Small environment for the webcam demo on a laptop (Windows works).
# No torch: the deep model runs through onnxruntime (models/factorizephys.onnx).
name: pulsecam-live
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.2
  - scipy=1.15
  - pyyaml=6.0
  - joblib
  - scikit-learn=1.6
  - pip
  - pip:
      - opencv-contrib-python==4.10.0.84
      - mediapipe==1.2.0
      - onnxruntime==1.22.0
      - -e .
